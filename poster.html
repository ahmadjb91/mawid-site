<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mawid · שלט QR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
:root { --plum: #2E1A47; --plum-2: #4A2C6B; --coral: #E8846B; --cream: #FBF6F1; --ink: #24152F; --muted: #6E6177; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #E9E2DA; font-family: "Rubik", "Segoe UI", Tahoma, sans-serif; color: var(--ink); }
[hidden] { display: none !important; }
@page { size: A5 portrait; margin: 0; }

.tools { max-width: 560px; margin: 16px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
.tools label { font-weight: 500; font-size: 14px; }
.tools input { width: 100%; font: 16px inherit; font-family: inherit; padding: 12px 14px; border: 1.5px solid #CFC3B8; border-radius: 12px; background: #fff; }
.tools button { font: 700 17px inherit; font-family: inherit; padding: 14px; border: 0; border-radius: 14px; background: var(--plum); color: #fff; cursor: pointer; }
.tools p { margin: 0; font-size: 13px; color: var(--muted); }

/* the sheet: A5 = 148 × 210 mm */
.sheet { width: 148mm; height: 210mm; margin: 0 auto 24px; background: var(--cream); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.15); }
.band { background: radial-gradient(120% 90% at 85% 0%, var(--plum-2) 0%, var(--plum) 60%); color: var(--cream); padding: 10mm 10mm 9mm; text-align: center; }
.brand { display: inline-flex; align-items: center; gap: 3mm; font-weight: 800; font-size: 7mm; }
.band h1 { margin: 5mm 0 0; font-size: 9.5mm; line-height: 1.15; font-weight: 800; }
.band h1.ar { margin-top: 2mm; font-size: 8.5mm; color: var(--coral); }
.body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4mm; padding: 6mm 10mm; text-align: center; }
.biz { font-size: 7mm; font-weight: 800; line-height: 1.2; max-width: 120mm; overflow-wrap: anywhere; }
.qr { width: 66mm; height: 66mm; background: #fff; border-radius: 5mm; padding: 4mm; border: 1.2mm solid var(--coral); }
.qr svg { width: 100%; height: 100%; display: block; }
.scan { font-size: 4.6mm; font-weight: 500; line-height: 1.45; }
.scan .ar { display: block; }
.foot { border-top: .4mm solid #E2D6CB; padding: 4mm 10mm 6mm; display: flex; justify-content: space-between; align-items: center; font-size: 3.4mm; color: var(--muted); }
.foot b { color: var(--ink); }

@media print {
  html, body { background: #fff; }
  .tools { display: none; }
  .sheet { margin: 0; box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
@media screen and (max-width: 600px) {
  .sheet { zoom: .62; }
}
</style>
</head>
<body>

<div class="tools">
  <label for="name">שם העסק · اسم المصلحة</label>
  <input id="name" type="text" placeholder="לדוגמה: מספרת אחמד">
  <button id="print" type="button">הדפסה / שמירה כ־PDF · طباعة</button>
  <p>השלט בגודל A5. אפשר להדפיס על A4 ולגזור, או לשמור כ־PDF ולשלוח לבית דפוס.</p>
</div>

<div class="sheet">
  <div class="band">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#FBF6F1" fill-opacity=".12"/><circle cx="32" cy="32" r="17" fill="none" stroke="#FBF6F1" stroke-opacity=".25" stroke-width="4"/><circle cx="32" cy="32" r="17" fill="none" stroke="#E8846B" stroke-width="4" stroke-dasharray="80 200" stroke-linecap="round" transform="rotate(-90 32 32)"/><path d="M32 22v10l7 5" stroke="#FBF6F1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="32" cy="32" r="2.6" fill="#E8846B"/></svg>
      Mawid
    </div>
    <h1>קבעו את התור הבא שלכם</h1>
    <h1 class="ar" lang="ar">احجزوا دوركم الجاي</h1>
  </div>
  <div class="body">
    <div class="biz" id="bizOut" hidden></div>
    <div class="qr" id="qr"></div>
    <div class="scan">
      סרקו את הקוד במצלמה ובחרו שעה פנויה
      <span class="ar" lang="ar">امسحوا الكود بالكاميرا واختاروا وقت فاضي</span>
    </div>
  </div>
  <div class="foot">
    <span><b>24/7</b> · בלי להתקשר · بدون تلفون</span>
    <span>App Store · Google Play</span>
  </div>
</div>

<script src="qrcode.js"></script>
<script>
const SITE = 'https://mawid.ajsoftworks.com/';
const input = document.getElementById('name');
try { input.value = (new URLSearchParams(location.search).get('n') || '').slice(0, 60); } catch (e) {}

function draw() {
  const name = input.value.trim();
  const url = SITE + (name ? '?n=' + encodeURIComponent(name) : '');
  const out = document.getElementById('bizOut');
  out.textContent = name; out.hidden = !name;
  const q = qrcode(0, 'M'); q.addData(url, 'Byte'); q.make();
  document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
  document.querySelector('#qr svg path, #qr svg rect:last-child') && document.querySelectorAll('#qr svg path').forEach((p) => p.setAttribute('fill', '#2E1A47'));
}
input.addEventListener('input', draw);
document.getElementById('print').addEventListener('click', () => window.print());
draw();
</script>
</body>
</html>
