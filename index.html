<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mawid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Mawid – קביעת תורים לספרים, מעצבות שיער וקוסמטיקאיות, בעברית ובערבית.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: plum hero with the booking card as the thesis, then two audiences side by side, then the business offer. */
:root {
  --plum: #2E1A47; --plum-2: #4A2C6B; --coral: #E8846B; --coral-ink: #2E1A47;
  --bg: #F6F1EB; --surface: #FFFFFF; --ink: #24152F; --muted: #6E6177; --line: #E6DCD3;
  --hero-ink: #FBF6F1;
  --f: "Rubik", "Segoe UI", "Arial Hebrew", "Noto Sans Arabic", Tahoma, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17101F; --surface: #221830; --ink: #F3ECF6; --muted: #B3A6BC; --line: #352847; color-scheme: dark;
} }
:root[data-theme="dark"] { --bg: #17101F; --surface: #221830; --ink: #F3ECF6; --muted: #B3A6BC; --line: #352847; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; border-radius: 8px; }

/* hero */
.hero { background: radial-gradient(120% 90% at 85% 0%, var(--plum-2) 0%, var(--plum) 60%); color: var(--hero-ink); padding-top: env(safe-area-inset-top, 0px); }
.hero .wrap { padding-block: 22px 56px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; letter-spacing: .01em; }
.lang { background: rgba(255,255,255,.1); color: var(--hero-ink); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 7px 14px; font: 500 14px var(--f); cursor: pointer; }
.hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 40px; align-items: center; margin-top: 44px; }
.biz-for { display: inline-block; background: var(--coral); color: var(--coral-ink); font-weight: 700; border-radius: 999px; padding: 6px 14px; font-size: 14px; margin-bottom: 16px; }
.hero h1 { font-size: clamp(34px, 6vw, 58px); font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--coral); }
.lede { margin-top: 16px; font-size: 18px; max-width: 30em; opacity: .88; }
.stores { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.store { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; background: #000; color: #fff; border: 1px solid rgba(255,255,255,.28); border-radius: 14px; padding: 10px 18px; min-width: 176px; }
.store svg { flex: 0 0 auto; }
.store small { display: block; font-size: 11px; opacity: .8; line-height: 1.2; }
.store b { display: block; font-size: 17px; font-weight: 700; line-height: 1.2; }
.store.mine { outline: 3px solid var(--coral); outline-offset: 2px; }
.note { margin-top: 12px; font-size: 13px; opacity: .7; }

/* booking card mock */
.mock { justify-self: center; width: min(300px, 100%); background: #FBF6F1; color: #24152F; border-radius: 28px; padding: 18px; box-shadow: 0 30px 60px rgba(10,4,20,.45); transform: rotate(-2deg); }
.mock .bar { display: flex; align-items: center; gap: 10px; }
.mock .av { width: 42px; height: 42px; border-radius: 12px; background: var(--plum); display: grid; place-items: center; color: #fff; font-weight: 800; }
.mock h3 { font-size: 16px; }
.mock .sub { font-size: 12px; color: #6E6177; }
.days { display: flex; gap: 6px; margin-top: 14px; }
.days span { flex: 1; text-align: center; border-radius: 10px; padding: 6px 0; font-size: 12px; background: #EFE6DD; }
.days span.on { background: var(--plum); color: #fff; }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; font-variant-numeric: tabular-nums; }
.slots span { text-align: center; border: 1.5px solid #E2D6CB; border-radius: 10px; padding: 7px 0; font-size: 13px; font-weight: 500; }
.slots span.taken { color: #B9AEB5; text-decoration: line-through; border-style: dashed; }
.slots span.pick { background: var(--coral); border-color: var(--coral); color: #2E1A47; font-weight: 700; }
.agenda { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 6px; }
.agenda li { display: grid; grid-template-columns: 46px 1fr auto; gap: 8px; align-items: center; background: #fff; border: 1px solid #EADFD5; border-radius: 12px; padding: 8px 10px; font-size: 13px; }
.agenda time { font-weight: 700; color: var(--plum); font-variant-numeric: tabular-nums; }
.agenda b { font-variant-numeric: tabular-nums; }
.agenda li.new { border-color: var(--coral); background: #FDEEE9; }
.agenda i { font-style: normal; font-size: 11px; font-weight: 700; background: var(--coral); color: var(--plum); border-radius: 999px; padding: 2px 8px; }
.mock .ok { margin-top: 12px; background: var(--plum); color: #fff; border-radius: 12px; text-align: center; padding: 10px; font-weight: 700; font-size: 14px; }

/* features */
.feat-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 26px; }
.feat-head h2 { font-size: clamp(26px, 4vw, 36px); }
.feat-head p { color: var(--muted); max-width: 36em; }
.feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.feat { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.phone { align-self: center; width: 200px; max-width: 100%; aspect-ratio: 360 / 692; border-radius: 26px; overflow: hidden; border: 6px solid #1B1024; background: #1B1024; box-shadow: 0 14px 30px rgba(46,26,71,.18); }
.phone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.feat h3 { font-size: 19px; }
.feat p { color: var(--muted); font-size: 15px; }
@media (max-width: 760px) {
  .feats { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 14px; padding-bottom: 10px; margin-inline: calc(-1 * max(18px, env(safe-area-inset-left, 0px))); padding-inline: max(18px, env(safe-area-inset-left, 0px)); scrollbar-width: thin; }
  .feat { flex: 0 0 78%; scroll-snap-align: center; }
  .swipe { display: block !important; }
}
.swipe { display: none; color: var(--muted); font-size: 13px; margin-top: 4px; }

/* audiences */
section { padding-block: 56px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--coral); text-transform: uppercase; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 26px; min-width: 0; }
.panel h2 { font-size: 24px; margin-top: 6px; }
.panel ul { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 12px; }
.panel li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; }
.panel li svg { margin-top: 3px; }

/* offer */
.offer { background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.offer-grid { display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: center; }
.offer h2 { font-size: clamp(26px, 4vw, 36px); }
.offer p.lede2 { margin-top: 10px; color: var(--muted); max-width: 34em; }
.price { display: flex; gap: 12px; }
.price div { border: 1.5px solid var(--line); border-radius: 18px; padding: 14px 20px; text-align: center; min-width: 120px; }
.price div.best { border-color: var(--coral); }
.price small { display: block; color: var(--muted); font-size: 13px; }
.price b { display: block; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
.trial { margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--coral) 16%, transparent); border-radius: 12px; padding: 8px 14px; font-weight: 500; }

footer { padding-block: 30px calc(30px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 14px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }

@media (max-width: 760px) {
  .hero-grid, .two, .offer-grid { grid-template-columns: 1fr; }
  .hero-grid { margin-top: 28px; gap: 34px; }
  .mock { transform: none; }
  .store { flex: 1 1 160px; justify-content: center; }
  section { padding-block: 40px; }
}
@media (prefers-reduced-motion: no-preference) {
  .slots span.pick { animation: pick 2.4s ease-in-out infinite; }
  @keyframes pick { 0%, 100% { transform: none; } 50% { transform: scale(1.06); } }
}
</style>
</head>

const check = '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#E8846B" fill-opacity=".18"/><path d="m7 12.5 3.2 3L17 9" fill="none" stroke="#E8846B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// ?n=<business name> — the page a business shares with its clients
let bizName = '';
try { bizName = (new URLSearchParams(location.search).get('n') || '').slice(0, 60); } catch (e) {}

let lang = 'he';
try { const q = new URLSearchParams(location.search).get('lang'); lang = q === 'ar' || q === 'he' ? q : ((navigator.language || '').startsWith('ar') ? 'ar' : 'he'); } catch (e) {}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  // a business's own link (?n=) shows the client version of the hero
  const key = (k) => (bizName && t[k + 'c'] ? k + 'c' : k);
  document.querySelectorAll('[data-t]').forEach((el) => { el.innerHTML = t[key(el.dataset.t)]; });
  document.getElementById('mockBiz').hidden = !!bizName;
  document.getElementById('mockClient').hidden = !bizName;
  document.querySelectorAll('[data-list]').forEach((ul) => { ul.innerHTML = t[ul.dataset.list].map((x) => `<li>${check}<span>${x}</span></li>`).join(''); });
  document.getElementById('feats').innerHTML = t.feats.map(([img, h, p]) =>
    `<article class="feat"><div class="phone"><img src="img/${lang}-${img}.jpg" alt="${h}" loading="lazy" width="360" height="692"></div><h3>${h}</h3><p>${p}</p></article>`).join('');
  document.getElementById('lang').textContent = t.other;
  const bf = document.getElementById('bizFor');
  if (bizName) { bf.textContent = t.forBiz.replace('{n}', bizName); bf.hidden = false; }
}
document.getElementById('lang').addEventListener('click', () => { lang = lang === 'he' ? 'ar' : 'he'; render(); });

// mark the store that matches this phone
const ua = navigator.userAgent || '';
if (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document)) document.getElementById('ios').classList.add('mine');
else if (/Android/i.test(ua)) document.getElementById('android').classList.add('mine');

render();
